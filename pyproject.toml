[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory"
version = "0.1.0"
description = "Korean-first agent memory MCP server. Local SQLite, Kiwi morpheme lexical search, Korean-tuned embeddings."
readme = "README.md"
requires-python = ">=3.11"

# Deliberately small. MARM needed fastapi/uvicorn/spacy/fastembed/apscheduler for
# an HTTP console, concept NER and a scheduler we do not build; a STDIO MCP server
# with local retrieval needs none of them.
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "onnxruntime>=1.20",   # runs the Korean embedding model; no torch needed
    "tokenizers>=0.21",    # XLM-R tokenizer for the same model
    "kiwipiepy>=0.20",     # Korean morphological analysis for the lexical lane
    "numpy>=2.0",
]

[project.optional-dependencies]
# Only needed to re-export the ONNX model from HuggingFace weights (see
# scripts/export_model.py). Not required to run the server.
# optimum 2.x moved the onnxruntime integration into its own distribution, so
# `optimum[exporters]` alone no longer provides `optimum.onnxruntime`.
# `onnx` is listed explicitly rather than left to optimum-onnx's dependency tree:
# quantizing the reranker goes through onnxruntime.quantization, which imports it.
export = ["torch>=2.4", "transformers>=4.44", "optimum>=2.1", "optimum-onnx>=0.1",
          "onnx>=1.16"]

[project.scripts]
agent-memory = "agent_memory.server:main"
agent-memory-migrate = "agent_memory.migrate:main"

[tool.setuptools.packages.find]
include = ["agent_memory*"]
